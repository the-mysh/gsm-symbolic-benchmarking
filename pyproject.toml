[project]
name = "gsm_benchmarker"
version = "0.0.1"
description = "Reproducing and extending GSM-Symbolic benchmark"
readme = "README.md"
requires-python = "==3.12.*"  # for now, to keep consistent with current remote version (on the cluster)
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
  "accelerate",
  "bitsandbytes",
  "coloredlogs",
  "datasets",
  "einops",
  "formulae",
  "great-tables",
  "ipywidgets",
  "joblib",
  "matplotlib",
  "notebook",
  "numpy",
  "packaging",
  "pandas",
  "pandas-stubs",
  "polars",
  "protobuf",
  "psutil",
  "pymer4>=0.9.2",
  "python-dotenv",
  "rpy2",
  "scikit-learn",
  "scipy",
  "scipy-stubs~=1.17.1",
  "seaborn",
  "sentencepiece",
  "statsmodels",
  "tiktoken",
  "torch>=2.7.0", # using 2.9.0+cu126
  "tqdm",
  "transformers>=4.51", # using 4.57.1
]

[project.optional-dependencies]
testing = [
  "pytest",
  "pytest-mock"
]
api_models = [
  "openai",
  "anthropic",
  "google-genai"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
